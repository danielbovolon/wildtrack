name: Free daily edition

# Builds today's seed (photo, poem, listening, crossover and news) from Wikipedia,
# Wiktionary, Wikimedia Commons, PoetryDB and the sources' news feeds, commits it
# and redeploys the site. No AI, free on GitHub Actions.
# A seed that already exists for today (for example from a Claude run) is left alone.

on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC = 06:23 Rome in winter, 07:23 in summer
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's seed
        run: python3 scripts/free_daily.py
      - name: Validate data and rebuild index
        run: python3 scripts/build_index.py
      - name: Commit
        run: |
          git config user.name "Wildtrack bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "Free edition for $(TZ=Europe/Rome date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
